<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Finder JS</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="container">
    <h1>🎬 Movie Finder</h1>
    
    <div class="search-box">
      <input type="text" id="movieInput" placeholder="Γράψε τίτλο ταινίας...">
      <button id="searchBtn">Αναζήτηση</button>
    </div>

    <!-- Εδώ η JS θα προσθέτει δυναμικά τις ταινίες -->
    <div id="results" class="results-grid"></div>
  </div>

  <!-- Σύνδεση με το αρχείο JavaScript -->
  <script type="module" src="app.js"></script>
</body>
</html>
